# Save this file in your repo at:  .github/workflows/str-agent.yml
#
# Runs the agent hourly, then commits listings.csv (the live list your Google
# Sheet reads) and seen.json (so alerts don't repeat).

name: STR Deal Agent

on:
  schedule:
    - cron: "0 * * * *"   # top of every hour (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run the agent
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          AIRROI_API_KEY: ${{ secrets.AIRROI_API_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python str_deal_agent.py

      - name: Save the live list and state
        run: |
          git config user.name "str-agent"
          git config user.email "str-agent@users.noreply.github.com"
          git add listings.csv seen.json alerts.csv revenue_cache.json || true
          git commit -m "Update live listings" || echo "No changes"
          git push || echo "Nothing to push"
